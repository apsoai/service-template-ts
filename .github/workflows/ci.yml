name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: apso
          POSTGRES_PASSWORD: password
          POSTGRES_DB: apso
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Secret scan (no hardcoded credentials in the scaffolded template)
      run: bash scripts/secret-scan.sh

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm run test
      env:
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        DATABASE_USERNAME: apso
        DATABASE_PASSWORD: password
        DATABASE_NAME: apso
        DATABASE_SCHEMA: apso
        NODE_ENV: test

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        DATABASE_USERNAME: apso
        DATABASE_PASSWORD: password
        DATABASE_NAME: apso
        DATABASE_SCHEMA: apso
        NODE_ENV: test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} 